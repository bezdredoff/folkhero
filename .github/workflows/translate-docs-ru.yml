name: Translate documentation to Russian

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - "Docs/**/*.md"
  workflow_dispatch:
    inputs:
      force:
        description: "Retranslate all docs even when source hashes match"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-translation-ru
  cancel-in-progress: true

jobs:
  translate:
    name: Sync Russian documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check translation API configuration
        id: api
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions, then run this workflow manually."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.api.outputs.configured == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install translator dependency
        if: steps.api.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check openai

      - name: Prepare persistent translation branch
        if: steps.api.outputs.configured == 'true'
        shell: bash
        run: |
          git fetch origin main

          if git ls-remote --exit-code --heads origin automation/docs-ru >/dev/null 2>&1; then
            git fetch origin automation/docs-ru:refs/remotes/origin/automation/docs-ru
            git checkout -B automation/docs-ru origin/automation/docs-ru
            git merge --no-edit origin/main
          else
            git checkout -B automation/docs-ru origin/main
          fi

      - name: Translate changed documentation
        if: steps.api.outputs.configured == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.DOCS_TRANSLATION_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ inputs.force }}
        run: |
          set -euo pipefail

          args=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--all)
            if [[ "$FORCE_ALL" == "true" ]]; then
              args+=(--force)
            fi
          else
            args+=(--base "$BASE_SHA" --head "$SOURCE_SHA")
          fi

          python Tools/i18n/translate_markdown.py "${args[@]}"

      - name: Commit and push generated translations
        if: steps.api.outputs.configured == 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A ru

          if ! git diff --cached --quiet; then
            git commit -m "docs(i18n): sync Russian translations"
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes relative to main."
            exit 0
          fi

          git push origin HEAD:automation/docs-ru
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or update translation pull request
        if: steps.api.outputs.configured == 'true' && steps.publish.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --base main \
            --head automation/docs-ru \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Translation PR #$existing_pr already exists and has been updated."
            exit 0
          fi

          if ! gh pr create \
            --base main \
            --head automation/docs-ru \
            --title "docs(i18n): sync Russian translations" \
            --body "Automated Russian mirror of the canonical README.md and Docs/**/*.md files. Generated files live under /ru and should not be edited manually."; then
            echo "::warning::Translations were pushed to automation/docs-ru, but GitHub Actions could not create the PR. If repository policy blocks PR creation, enable it under Settings > Actions > General > Workflow permissions, or open the PR manually."
          fi
